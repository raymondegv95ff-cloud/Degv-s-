<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ultra Neon Blur Filters for Eye-Catching Glows -->
    <filter id="brutalGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="blur1" />
      <feGaussianBlur stdDeviation="32" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="coreSparkleGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Futuristic Gradients -->
    <radialGradient id="deepBackgroundGlow" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#09261B" />
      <stop offset="45%" stop-color="#051210" />
      <stop offset="100%" stop-color="#020506" />
    </radialGradient>

    <linearGradient id="neonEmerald3D" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF7F" />
      <stop offset="40%" stop-color="#00E676" />
      <stop offset="85%" stop-color="#00B248" />
      <stop offset="100%" stop-color="#006622" />
    </linearGradient>

    <linearGradient id="electricCyanGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="60%" stop-color="#00FFB7" />
      <stop offset="100%" stop-color="#00E676" />
    </linearGradient>

    <linearGradient id="glassReflectionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.3" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#00FF66" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="laserFrameBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#00F0FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#00E676" stop-opacity="0.2" />
    </linearGradient>

    <!-- Background Grid Pattern -->
    <pattern id="cyberGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#00FF7F" stroke-width="1" stroke-opacity="0.08" />
      <circle cx="0" cy="0" r="1.5" fill="#00FF7F" fill-opacity="0.2" />
    </pattern>
  </defs>

  <!-- Base Squircle Container (App Icon Squircle shape) -->
  <rect width="512" height="512" rx="128" fill="url(#deepBackgroundGlow)" />
  <rect width="512" height="512" rx="128" fill="url(#cyberGrid)" />

  <!-- Outer Neon HUD Border -->
  <rect width="502" height="502" x="5" y="5" rx="124" fill="none" stroke="url(#laserFrameBorder)" stroke-width="3" />

  <!-- Corner Tech Accents -->
  <path d="M 32 80 L 32 32 L 80 32" fill="none" stroke="#00FF7F" stroke-width="4" stroke-linecap="round" />
  <path d="M 432 32 L 480 32 L 480 80" fill="none" stroke="#00FF7F" stroke-width="4" stroke-linecap="round" />
  <path d="M 480 432 L 480 480 L 432 480" fill="none" stroke="#00FF7F" stroke-width="4" stroke-linecap="round" />
  <path d="M 80 480 L 32 480 L 32 432" fill="none" stroke="#00FF7F" stroke-width="4" stroke-linecap="round" />

  <!-- Glowing Orbit Concentric Rings -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="#00FF7F" stroke-width="2" stroke-opacity="0.2" stroke-dasharray="24 16 8 16" />
  <circle cx="256" cy="256" r="215" fill="none" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.15" stroke-dasharray="40 20" />

  <!-- MAIN 3D GLASSMORPHIC CYBER MESSENGER EMBLEM -->
  <g filter="url(#brutalGlow)">
    <!-- Outer Shield / Futuristic Chat Bubble Silhouette -->
    <path d="M 136 128 
             L 336 128 
             C 380 128 408 156 408 200 
             L 408 280 
             C 408 324 380 352 336 352 
             L 248 352 
             L 152 416 
             L 172 352 
             L 136 352 
             C 92 352 64 324 64 280 
             L 64 200 
             C 64 156 92 128 136 128 Z" 
          fill="none" 
          stroke="url(#neonEmerald3D)" 
          stroke-width="28" 
          stroke-linejoin="miter" 
          stroke-miterlimit="10" />

    <!-- Inner Quantum D-Shape Core -->
    <path d="M 176 184 
             L 248 184 
             C 296 184 328 204 328 240 
             C 328 276 296 296 248 296 
             L 176 296 Z" 
          fill="none" 
          stroke="url(#electricCyanGradient)" 
          stroke-width="20" 
          stroke-linejoin="round" />

    <!-- Central Glowing Core Pillar -->
    <path d="M 224 216 L 248 216 C 268 216 282 226 282 240 C 282 254 268 264 248 264 L 224 264 Z"
          fill="url(#neonEmerald3D)" />

    <!-- AI Energy Sparkle Flares -->
    <polygon points="380,108 392,128 412,128 396,140 402,160 380,146 358,160 364,140 348,128 368,128" fill="#00FF7F" filter="url(#coreSparkleGlow)" />
    <polygon points="120,380 128,394 142,394 130,402 134,416 120,406 106,416 110,402 98,394 112,394" fill="#00F0FF" filter="url(#coreSparkleGlow)" />

    <!-- Cyber Signal Pulse Spheres -->
    <circle cx="112" cy="240" r="12" fill="#00F0FF" />
    <circle cx="408" cy="240" r="12" fill="#00FF7F" />
  </g>

  <!-- 3D Specular Glass Overlay Highlight -->
  <path d="M 128 32 C 200 32, 400 32, 480 160 C 380 180, 200 180, 32 128 C 32 80, 80 32, 128 32 Z" fill="url(#glassReflectionGrad)" />

  <!-- Bottom Cyber Branding Label -->
  <text x="256" y="472" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#00FF7F" letter-spacing="10" opacity="0.9">
    DEGV • MESSENGER
  </text>
</svg>
