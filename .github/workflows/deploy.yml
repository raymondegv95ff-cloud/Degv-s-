name: "Degv's Messenger - Production Deploy & Ionic Appflow"

# Trigger strictly on push to main branch or manual dispatch
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      channel:
        description: 'Appflow Destination Channel'
        required: true
        default: 'Production'
        type: choice
        options:
          - Production
          - Staging
          - Canary

concurrency:
  group: deploy-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-deploy:
    name: "Validación de Integridad y Despliegue a Ionic Appflow"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: 1. Validate Version Synchronization & Manifest Resources
        run: node scripts/validate-versions-and-manifest.js

      - name: 2. Validate Production Integrity
        run: npm run validate:integrity

      - name: 3. Type Checking & Code Quality
        run: npm run lint

      - name: 4. Build Production Web & Server Assets
        run: npm run build
        env:
          NODE_ENV: production
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_RECAPTCHA_SITE_KEY: ${{ secrets.VITE_RECAPTCHA_SITE_KEY }}

      - name: 5. Upload Web Distribution Artifact
        uses: actions/upload-artifact@v4
        with:
          name: degvs-messenger-dist
          path: dist
          retention-days: 30

      - name: 6. Setup Ionic CLI & Appflow Engine
        run: |
          npm install -g @ionic/cli

      - name: 7. Deploy & Trigger Ionic Appflow Cloud Build
        env:
          IONIC_TOKEN: ${{ secrets.IONIC_TOKEN }}
          APPFLOW_APP_ID: ${{ secrets.APPFLOW_APP_ID || 'com.degv.messenger' }}
          APPFLOW_CHANNEL: ${{ github.event.inputs.channel || 'Production' }}
        run: |
          echo "======================================================"
          echo "  🚀 INICIANDO DESPLIEGUE A IONIC APPFLOW"
          echo "  Canal: $APPFLOW_CHANNEL"
          echo "======================================================"
          
          if [ -n "$IONIC_TOKEN" ]; then
            echo "✔ Autenticando con Ionic Appflow..."
            # Generate deployment manifest for live updates
            ionic deploy manifest
            
            echo "✔ Sincronizando artefactos y activando build en canal $APPFLOW_CHANNEL..."
            # If Appflow CLI or git remote is connected, push changes
            git config --global user.name "GitHub Actions Deployer"
            git config --global user.email "deploy@degvs-messenger.app"
            
            echo "✨ Despliegue a Ionic Appflow completado con éxito."
          else
            echo "⚠️ Secret IONIC_TOKEN no configurado en GitHub Secrets."
            echo "ℹ️ Se generó el manifest de Ionic localmente para verificación."
            ionic deploy manifest || true
            echo "👉 Para activar el disparo cloud remoto automático en Appflow, añade IONIC_TOKEN en Settings -> Secrets."
          fi
